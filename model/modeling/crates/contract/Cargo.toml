[package]
name = "pdma-model-contract"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "PDMA DMA and management wire and register schemas"

[features]
default = []
export-c-header = ["hw-model-schema/export-c-header"]

[[bin]]
name = "pdma-abi-header"
path = "src/bin/pdma-abi-header.rs"
required-features = ["export-c-header"]

[[bin]]
name = "pdma-rtl-layout"
path = "src/bin/pdma-rtl-layout.rs"

[dependencies]
hw-model-schema = "0.1.0"

[lints]
workspace = true
