[package]
name = "pdma-model-firmware"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Async software for the managed DMA configuration"

[dependencies]
hw-model-io = { version = "0.1.0", path = "../hw-model-io", default-features = false }
hw-model-swenv = { version = "0.1.0", path = "../hw-model-swenv" }
pdma-model-software = { path = "../software" }
pdma-model-contract = { path = "../contract" }
hw-model-schema = { path = "../hw-model-schema" }
tokio = { version = "1.49", default-features = false, features = ["rt", "macros"] }

[dev-dependencies]
hw-model-irq = { version = "0.1.0", path = "../hw-model-irq" }
tokio = { version = "1.49", default-features = false, features = ["macros", "rt", "sync"] }

[lints]
workspace = true
