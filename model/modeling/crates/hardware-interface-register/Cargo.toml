[package]
name = "hardware-interface-register"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
readme = "README.md"
include = ["src/**", "tests/**", "examples/**", "README.md", "clippy.toml", "LICENSE-MIT", "LICENSE-APACHE", "Cargo.toml"]
description = "Register transports, images and ordered observations"

[features]
default = ["schema"]
schema = ["dep:hardware-interface-schema"]

[dependencies]
hardware-interface-storage = { version = "0.1.0", path = "../hardware-interface-storage" }
hardware-interface-schema = { version = "0.1.0", path = "../hardware-interface-schema", optional = true }

[dev-dependencies]
hardware-interface-memory = { version = "0.1.0", path = "../hardware-interface-memory" }

[lints]
workspace = true

[[test]]
name = "register_image"
required-features = ["schema"]

[[test]]
name = "register_bus"
required-features = ["schema"]

[[test]]
name = "register_gate"
path = "tests/register_gate/mod.rs"
