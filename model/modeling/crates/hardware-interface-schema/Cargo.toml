[package]
name = "hardware-interface-schema"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Reusable hardware interface schema vocabulary and scalar codecs"

[dependencies]
hardware-interface-schema-macros = { path = "../hardware-interface-schema-macros" }

[dev-dependencies]
trybuild = "1"

[features]
default = []
export-c-header = []

[lints]
workspace = true

[[example]]
name = "documented_schema"
required-features = ["export-c-header"]

[[test]]
name = "c_header"
path = "tests/c_header/mod.rs"

[[test]]
name = "record_type_language"
path = "tests/record_type_language/mod.rs"

[[test]]
name = "register_layout_dsl"
path = "tests/register_layout_dsl/mod.rs"

[[test]]
name = "instance_banks"
path = "tests/instance_banks/mod.rs"
