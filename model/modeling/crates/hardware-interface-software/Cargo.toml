[package]
name = "hardware-interface-software"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
readme = "README.md"
include = ["src/**", "tests/**", "examples/**", "README.md", "clippy.toml", "LICENSE-MIT", "LICENSE-APACHE", "Cargo.toml"]
description = "Software execution environments, interrupt dispatch, and runtime services"

[dependencies]
hardware-interface-irq = { version = "0.1.0", path = "../hardware-interface-irq", default-features = false }
hardware-interface-io = { version = "0.1.0", path = "../hardware-interface-io", default-features = false }
tokio = { version = "1.49", default-features = false, features = ["macros", "rt", "sync"] }

[dev-dependencies]
hardware-interface-irq = { version = "0.1.0", path = "../hardware-interface-irq", features = ["tokio"] }

[lints]
workspace = true

[[test]]
name = "interrupt_dispatch"
path = "tests/interrupt_dispatch/mod.rs"
