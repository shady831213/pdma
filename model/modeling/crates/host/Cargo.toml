[package]
name = "pdma-model-host"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Host management client and direct DMA runtime assembly"

[dependencies]
hw-model-irq = { version = "0.1.0", path = "../hw-model-irq" }
hw-model-io = { version = "0.1.0", path = "../hw-model-io", default-features = false }
pdma-model-software = { path = "../software" }
pdma-model-contract = { path = "../contract" }
pdma-model-dma = { path = "../dma" }
hw-model-pipeline = { path = "../hw-model-pipeline" }
hw-model-schema = { path = "../hw-model-schema" }
tokio = { version = "1.49", default-features = false, features = ["macros", "rt", "sync", "time"] }

[lints]
workspace = true

[dev-dependencies]
hw-model-swenv = { version = "0.1.0", path = "../hw-model-swenv" }
tokio = { version = "1.49", default-features = false, features = ["test-util", "time"] }
