[package]
name = "downstream-backends"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace]
resolver = "3"

[features]
negative-escape-reference = []
negative-async-storage-closure = []
negative-dyn-stage = []

[dependencies]
hw-model-io = "0.1.0"
hip = { version = "0.1.0", package = "hw-model-pipeline" }

[[bin]]
name = "escape_reference"
path = "negative/escape_reference.rs"
required-features = ["negative-escape-reference"]

[[bin]]
name = "async_storage_closure"
path = "negative/async_storage_closure.rs"
required-features = ["negative-async-storage-closure"]

[[bin]]
name = "dyn_stage"
path = "negative/dyn_stage.rs"
required-features = ["negative-dyn-stage"]

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
