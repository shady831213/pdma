[package]
name = "downstream-pipeline"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace]
resolver = "3"

[dependencies]
hip = { version = "0.1.0", package = "hw-model-pipeline" }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
