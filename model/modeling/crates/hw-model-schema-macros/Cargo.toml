[package]
name = "hw-model-schema-macros"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = ["crates-io"]
readme = "README.md"
include = ["src/**", "tests/**", "examples/**", "README.md", "clippy.toml", "LICENSE-MIT", "LICENSE-APACHE", "Cargo.toml"]
description = "Procedural macro implementation crate for hw-model-schema"
keywords = ["hardware", "modeling", "schema", "macros"]
categories = ["development-tools"]
documentation = "https://docs.rs/hw-model-schema-macros"

[lib]
proc-macro = true

[dependencies]
proc-macro-crate = "3"
proc-macro2 = "1"
quote = "1"
syn = "3"

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
