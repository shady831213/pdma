[package]
name = "hw-model-schema"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = ["crates-io"]
readme = "README.md"
include = ["src/**", "tests/**", "examples/**", "README.md", "clippy.toml", "LICENSE-MIT", "LICENSE-APACHE", "Cargo.toml"]
description = "Hardware interface schemas, typed codecs, register maps, and extensible code generation"
keywords = ["hardware", "modeling", "schema", "registers", "codegen"]
categories = ["development-tools"]
documentation = "https://docs.rs/hw-model-schema"

[dependencies]
hw-model-schema-macros = "=0.2.0"
inventory = { version = "0.3.25", optional = true }

[dev-dependencies]
trybuild = "1"

[package.metadata.docs.rs]
all-features = true

[features]
default = []
discovery = ["dep:inventory"]
export-c-header = []
export-veryl-layout = []
export-sv = []
export-uvm-regs = []

[lints]
workspace = true

[[example]]
name = "documented_schema"
required-features = ["export-c-header"]

[[test]]
name = "c_header"
path = "tests/c_header_tests.rs"

[[test]]
name = "record_type_language"
path = "tests/record_type_language/mod.rs"

[[test]]
name = "register_layout_dsl"
path = "tests/register_layout_dsl/mod.rs"

[[test]]
name = "instance_banks"
path = "tests/instance_banks_tests.rs"

[[test]]
name = "uvm_exports"
path = "tests/uvm_exports/mod.rs"

[[example]]
name = "register_listing"
test = true

[[example]]
name = "sv_packages"
required-features = ["export-sv"]

[[example]]
name = "uvm_model"
required-features = ["export-uvm-regs"]
