[package]
name = "hw-model-schema"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = ["crates-io"]
readme = "README.md"
include = ["src/**", "tests/**", "examples/**", "README.md", "clippy.toml", "LICENSE-MIT", "LICENSE-APACHE", "Cargo.toml"]
description = "Reusable hardware interface schema vocabulary and scalar codecs"
keywords = ["hardware", "modeling", "schema", "registers", "codegen"]
categories = ["development-tools"]
documentation = "https://docs.rs/hw-model-schema"

[dependencies]
hw-model-schema-macros = "0.1.0"

[dev-dependencies]
trybuild = "1"

[package.metadata.docs.rs]
all-features = true

[features]
default = []
export-c-header = []

[lints]
workspace = true

[[example]]
name = "documented_schema"
required-features = ["export-c-header"]

[[test]]
name = "c_header"
path = "tests/c_header/mod.rs"

[[test]]
name = "record_type_language"
path = "tests/record_type_language/mod.rs"

[[test]]
name = "register_layout_dsl"
path = "tests/register_layout_dsl/mod.rs"

[[test]]
name = "instance_banks"
path = "tests/instance_banks/mod.rs"
