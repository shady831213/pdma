[package]
name = "hw-model-swenv"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = ["crates-io"]
readme = "README.md"
include = ["src/**", "tests/**", "examples/**", "README.md", "clippy.toml", "LICENSE-MIT", "LICENSE-APACHE", "Cargo.toml"]
description = "Software execution environments, interrupt dispatch, and runtime services"
keywords = ["hardware", "modeling", "async", "interrupts"]
categories = ["development-tools"]
documentation = "https://docs.rs/hw-model-swenv"

[dependencies]
hw-model-irq = { version = "0.1.0", path = "../hw-model-irq", default-features = false }
hw-model-io = { version = "0.1.0", path = "../hw-model-io", default-features = false }
tokio = { version = "1.49", default-features = false, features = ["macros", "rt", "sync"] }

[dev-dependencies]
hw-model-irq = { version = "0.1.0", path = "../hw-model-irq", features = ["tokio"] }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[[test]]
name = "interrupt_dispatch"
path = "tests/interrupt_dispatch/mod.rs"
