[package]
name = "pdma-model-scenarios"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Direct and firmware-managed PDMA system scenarios"

[dev-dependencies]
proc-macro2 = "1"
hardware-interface-irq = { version = "0.1.0", path = "../hardware-interface-irq" }
hardware-interface-io = { version = "0.1.0", path = "../hardware-interface-io", default-features = false }
hardware-interface-software = { version = "0.1.0", path = "../hardware-interface-software" }
pdma-model-software = { path = "../software" }
trybuild = "1"
pdma-model-contract = { path = "../contract" }
pdma-model-dma = { path = "../dma" }
pdma-model-host = { path = "../host" }
pdma-model-firmware = { path = "../firmware" }
pdma-model-hw-components = { path = "../hw-components" }
hardware-interface-pipeline = { path = "../hardware-interface-pipeline" }
hardware-interface-schema = { path = "../hardware-interface-schema" }
tokio = { version = "1.49", default-features = false, features = ["macros", "rt", "sync"] }

[lints]
workspace = true

[[test]]
name = "single_channel"
path = "tests/single_channel/main.rs"

[[test]]
name = "multi_channel"
path = "tests/multi_channel/main.rs"

[[test]]
name = "firmware_managed"
path = "tests/firmware_managed/main.rs"
