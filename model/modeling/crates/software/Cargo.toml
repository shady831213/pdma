[package]
name = "pdma-model-software"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Shared PDMA software drivers and rings for Host and firmware"

[dependencies]
hw-model-irq = "0.1.0"
hw-model-io = { version = "0.1.0", default-features = false }
hw-model-swenv = "0.1.0"
tokio = { version = "1.49", default-features = false, features = ["rt"] }
pdma-model-contract = { path = "../contract" }
hw-model-schema = "0.3.0"

[dev-dependencies]
pdma-model-dma = { path = "../dma" }
hw-model-pipeline = "0.1.0"
tokio = { version = "1.49", default-features = false, features = ["macros", "rt", "sync"] }

[lints]
workspace = true
