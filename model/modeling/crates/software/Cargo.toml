[package]
name = "pdma-model-software"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Shared PDMA software drivers and rings for Host and firmware"

[dependencies]
hw-model-irq = { version = "0.1.0", path = "../hw-model-irq" }
hw-model-io = { version = "0.1.0", path = "../hw-model-io", default-features = false }
hw-model-swenv = { version = "0.1.0", path = "../hw-model-swenv" }
tokio = { version = "1.49", default-features = false, features = ["rt"] }
pdma-model-contract = { path = "../contract" }
hw-model-schema = { path = "../hw-model-schema" }

[dev-dependencies]
pdma-model-dma = { path = "../dma" }
hw-model-pipeline = { path = "../hw-model-pipeline" }
tokio = { version = "1.49", default-features = false, features = ["macros", "rt", "sync"] }

[lints]
workspace = true
